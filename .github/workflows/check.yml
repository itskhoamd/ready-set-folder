name: Check workspaces

# Fails if someone edited _system/core or _system/niches but forgot to run the build
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 _system/tools/build.py --check
