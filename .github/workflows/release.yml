name: Release zips

# When you publish a release on GitHub (tag like v1.0), this builds
# ready-set-folder.zip (the starter) + one zip per ready-made workspace and attaches
# them to that release. The README links to releases/latest/download/<name>.zip,
# so links always point at the newest one.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the VERSION file
        run: |
          if [ "${{ github.event.release.tag_name }}" != "$(cat _system/VERSION)" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} doesn't match VERSION ($(cat _system/VERSION)). Edit _system/VERSION, run _system/tools/build.py, commit, then release again."
            exit 1
          fi
      - run: python3 _system/tools/build.py --check
      - run: python3 _system/tools/build.py --zip
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
